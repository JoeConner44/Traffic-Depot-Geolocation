<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traffic Depot – Customer Map</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  :root { --green:#16a34a; --yellow:#eab308; --red:#dc2626; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); }
  #app { display: flex; height: 100%; }
  #side { width: 320px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: #fff; }
  #map { flex: 1; }
  .head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .head h1 { font-size: 17px; margin: 0 0 2px; }
  .head small { color: var(--muted); }
  .head form { display: inline; }
  .head button.link { background: none; border: 0; color: #1d4ed8; cursor: pointer; padding: 0; font: inherit; }
  .legend { padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .legend label { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
  .legend .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .legend .count { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .legend .desc { color: var(--muted); font-size: 12px; }
  .statebox { padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .statebox label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .statebox select { width: 100%; padding: 7px 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .unmapped { flex: 1; overflow: auto; padding: 10px 16px; }
  .unmapped h2 { font-size: 13px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .unmapped ul { list-style: none; padding: 0; margin: 0; }
  .unmapped li { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .unmapped li .n { font-weight: 600; }
  .unmapped li .why { color: var(--muted); font-size: 12px; }
  .unmapped li .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .unmapped li a { font-size: 12px; }
  #msg { padding: 10px 16px; color: #b91c1c; display: none; }
  .legend .ice { width: 18px; height: 18px; flex: none; }
  .ice-icon img { width: 30px; height: 30px; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .tip b { font-size: 13px; } .tip div { font-size: 12px; }
  .people { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  .people h3 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .people ul { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow: auto; }
  .people li { padding: 4px 0; border-bottom: 1px solid #f1f1f1; }
  .people li .pn { font-weight: 600; } .people li .pm { color: var(--muted); font-size: 12px; }
  .people .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .pop .status { margin: 2px 0 4px; font-size: 12px; color: var(--muted); }
  .pop b { font-size: 15px; } .pop table { margin-top: 4px; border-collapse: collapse; }
  .pop td { padding: 1px 8px 1px 0; vertical-align: top; } .pop td:first-child { color: var(--muted); white-space: nowrap; }
  .pop .flag { margin-top: 6px; font-size: 12px; color: #92400e; background: #fef3c7; padding: 2px 6px; border-radius: 4px; display: inline-block; }
  @media (max-width: 700px) { #app { flex-direction: column-reverse; } #side { width: 100%; height: 42%; border-right: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="head">
      <h1>Traffic Depot Customers</h1>
      <small id="synced">Loading…</small> ·
      <form method="post" action="/logout"><button class="link" type="submit">Sign out</button></form>
    </div>
    <div id="msg"></div>
    <div class="statebox"><label for="stateSel">State</label><select id="stateSel"></select></div>
    <div class="legend" id="legend"></div>
    <div class="unmapped">
      <h2>Unmapped (<span id="uCount">0</span>)</h2>
      <ul id="uList"></ul>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script>
(function () {
  var COLORS = { green: '#16a34a', yellow: '#eab308', red: '#dc2626', grey: '#9ca3af' }; // ice uses the icon
  var ORDER = ['green', 'yellow', 'red', 'ice', 'grey'];
  var visible = { green: true, yellow: true, red: true, ice: true, grey: true };
  var markers = [];      // { c, layer }
  var unmappedLis = [];  // { c, li }
  var countEls = {};
  var selected = 'ALL';
  var stateNames = {};
  var cfg = { recentDays: 90, coldDays: 365 };

  var map = L.map('map', { preferCanvas: true }).setView([32.75, -83.4], 7); // centre of Georgia
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  // Ice cube image: your PNG if present, otherwise the bundled SVG.
  function iceImg(cls) {
    var img = el('img', { src: '/assets/ice-cube.png', alt: 'Ice cube', 'class': cls || '' });
    img.onerror = function () { img.onerror = null; img.src = '/assets/ice-cube.svg'; };
    return img;
  }
  function fmt(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function ago(iso) {
    if (!iso) return 'never';
    var d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
    if (d < 1) return 'today';
    if (d < 14) return d + (d === 1 ? ' day ago' : ' days ago');
    if (d < 60) return Math.round(d / 7) + ' weeks ago';
    if (d < 730) return Math.round(d / 30.4) + ' months ago';
    return (d / 365).toFixed(1) + ' years ago';
  }
  function when(iso) { return iso ? ago(iso) + ' (' + fmt(iso) + ')' : 'never'; }
  function statusText(c) {
    switch (c.status) {
      case 'green': return 'Purchased in the last ' + cfg.recentDays + ' days';
      case 'yellow': return 'Bought before; contacted in the last ' + cfg.recentDays + ' days';
      case 'red': return 'Bought before; no contact in ' + cfg.recentDays + ' days';
      case 'ice': return 'No purchase in ' + cfg.coldDays + '+ days';
      default: return 'No purchase on record';
    }
  }
  function linkTo(c) {
    return c.hubspotUrl ? el('a', { href: c.hubspotUrl, target: '_blank', rel: 'noopener', text: 'Open in HubSpot' }) : null;
  }
  function tooltip(c) {
    var root = el('div', { 'class': 'tip' });
    root.appendChild(el('b', { text: c.name }));
    root.appendChild(el('div', { text: statusText(c) }));
    root.appendChild(el('div', { text: 'Last purchase: ' + (c.lastPurchase ? ago(c.lastPurchase) : 'never') }));
    root.appendChild(el('div', { text: 'Last contact: ' + (c.lastContacted ? ago(c.lastContacted) : 'never') }));
    return root;
  }
  function popup(c) {
    var root = el('div', { 'class': 'pop' });
    root.appendChild(el('b', { text: c.name }));
    if (c.kind === 'person' && c.company) root.appendChild(el('div', { text: c.company }));
    root.appendChild(el('div', { 'class': 'status', text: statusText(c) }));
    var rows = [['City', c.city ? c.city + (c.state ? ', ' + c.state : '') : '—'], ['Last purchase', when(c.lastPurchase)], ['Last contact', when(c.lastContacted)]];
    var tbody = el('tbody');
    rows.forEach(function (r) { tbody.appendChild(el('tr', {}, [el('td', { text: r[0] }), el('td', { text: r[1] })])); });
    root.appendChild(el('table', {}, [tbody]));
    if (c.kind === 'company' && c.locationSource === 'contact') root.appendChild(el('div', { 'class': 'flag', text: 'Location from a contact’s address' }));
    var a = linkTo(c);
    if (a) { var p = el('div'); p.style.marginTop = '6px'; p.appendChild(a); root.appendChild(p); }
    if (c.kind === 'company' && !c.people.length) {
      var none = el('div', { 'class': 'people' }, [el('div', { 'class': 'pm', text: 'No contacts are linked to this company in HubSpot.' })]);
      root.appendChild(none);
    }
    if (c.kind === 'company' && c.people.length) {
      var ul = el('ul');
      c.people.forEach(function (p) {
        var dot = el('span', { 'class': 'dot' });
        if (p.status === 'ice') { dot.style.background = '#7dd3fc'; } else { dot.style.background = COLORS[p.status]; }
        var meta = 'Purchase: ' + (p.lastPurchase ? ago(p.lastPurchase) : 'never') + ' · Contact: ' + (p.lastContacted ? ago(p.lastContacted) : 'never');
        var li = el('li', {}, [el('div', { 'class': 'pn' }, [dot, document.createTextNode(p.name)]), el('div', { 'class': 'pm', text: meta })]);
        if (p.hubspotUrl) { var l = el('a', { href: p.hubspotUrl, target: '_blank', rel: 'noopener', text: 'HubSpot' }); l.style.fontSize = '12px'; li.appendChild(l); }
        ul.appendChild(li);
      });
      root.appendChild(el('div', { 'class': 'people' }, [el('h3', { text: 'People (' + c.people.length + ')' }), ul]));
    }
    return root;
  }

  // Places that share a geocoded point are fanned out slightly so each stays clickable.
  function jitter(list) {
    var seen = {};
    return list.map(function (c) {
      var key = c.lat.toFixed(5) + ',' + c.lng.toFixed(5), n = seen[key] = (seen[key] || 0) + 1;
      if (n === 1) return [c.lat, c.lng];
      var ang = n * 2.399963, rad = 0.0004 * Math.sqrt(n - 1); // golden-angle spiral, ~40 m steps
      return [c.lat + rad * Math.sin(ang), c.lng + rad * Math.cos(ang) / Math.cos(c.lat * Math.PI / 180)];
    });
  }

  function makeLayer(c, pt) {
    var layer;
    if (c.status === 'ice') {
      var holder = el('div', { 'class': 'ice-icon' }, [iceImg()]);
      layer = L.marker(pt, { icon: L.divIcon({ html: holder, className: '', iconSize: [30, 30], iconAnchor: [15, 15] }), riseOnHover: true });
    } else {
      layer = L.circleMarker(pt, { radius: c.kind === 'company' ? 8 : 6, color: '#fff', weight: 1.5, fillColor: COLORS[c.status], fillOpacity: 0.92 });
    }
    return layer.bindTooltip(function () { return tooltip(c); }, { direction: 'top', offset: [0, c.status === 'ice' ? -12 : -6] })
      .bindPopup(function () { return popup(c); }, { maxWidth: 360, minWidth: 260 });
  }

  // --- filtering ---
  function stateKey(c) { return c.state || '?'; }
  function inState(c) { return selected === 'ALL' || stateKey(c) === selected; }
  // Unmapped places with no known state stay visible under any state filter, so none are hidden silently.
  function unmappedInState(c) { return selected === 'ALL' || !c.state || c.state === selected; }

  function refresh(refit) {
    var counts = { green: 0, yellow: 0, red: 0, ice: 0, grey: 0 };
    var pts = [];
    markers.forEach(function (m) {
      var stateOk = inState(m.c);
      if (stateOk) { counts[m.c.status]++; pts.push(m.layer.getLatLng()); }
      var on = stateOk && visible[m.c.status], has = map.hasLayer(m.layer);
      if (on && !has) m.layer.addTo(map); else if (!on && has) map.removeLayer(m.layer);
    });
    Object.keys(countEls).forEach(function (k) { countEls[k].textContent = counts[k].toLocaleString(); });
    var shown = 0;
    unmappedLis.forEach(function (u) {
      var on = unmappedInState(u.c) && visible[u.c.status];
      u.li.style.display = on ? '' : 'none';
      if (on) shown++;
    });
    document.getElementById('uCount').textContent = shown;
    if (refit && pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: selected === 'ALL' ? 10 : 9 });
  }

  function buildStateSelect(data) {
    var byState = {}, total = data.mapped.length;
    data.mapped.forEach(function (c) { byState[stateKey(c)] = (byState[stateKey(c)] || 0) + 1; });
    var sel = document.getElementById('stateSel');
    var codes = Object.keys(byState).filter(function (k) { return k !== '?'; }).sort(function (a, b) {
      if (a === 'GA') return -1; if (b === 'GA') return 1;
      return (stateNames[a] || a).localeCompare(stateNames[b] || b);
    });
    function opt(value, label) { sel.appendChild(el('option', { value: value, text: label })); }
    opt('ALL', 'All states (' + total.toLocaleString() + ')');
    codes.forEach(function (k) { opt(k, (stateNames[k] || k) + ' (' + byState[k].toLocaleString() + ')'); });
    if (byState['?']) opt('?', 'Unknown state (' + byState['?'].toLocaleString() + ')');

    var saved = null;
    try { saved = localStorage.getItem('td_state'); } catch (e) { /* storage unavailable */ }
    var valid = function (v) { return v && Array.prototype.some.call(sel.options, function (o) { return o.value === v; }); };
    selected = valid(saved) ? saved : (byState.GA ? 'GA' : 'ALL'); // default to Georgia when there is any
    sel.value = selected;
    sel.addEventListener('change', function () {
      selected = sel.value;
      try { localStorage.setItem('td_state', selected); } catch (e) { /* ignore */ }
      refresh(true);
    });
  }

  function renderLegend() {
    var box = document.getElementById('legend');
    box.textContent = '';
    var r = cfg.recentDays, c = cfg.coldDays;
    var desc = {
      green: 'Purchased in the last ' + r + ' days',
      yellow: 'Bought ' + r + '–' + c + ' days ago; contacted in the last ' + r + ' days',
      red: 'Bought ' + r + '–' + c + ' days ago; no contact in ' + r + ' days',
      ice: 'No purchase in ' + c + '+ days',
      grey: 'No purchase on record'
    };
    var names = { green: 'Green', yellow: 'Yellow', red: 'Red', ice: 'Ice cube', grey: 'Grey' };
    ORDER.forEach(function (k) {
      var cb = el('input', { type: 'checkbox' });
      cb.checked = visible[k];
      cb.addEventListener('change', function () { visible[k] = cb.checked; refresh(false); });
      var mark;
      if (k === 'ice') mark = iceImg('ice'); else { mark = el('span', { 'class': 'dot' }); mark.style.background = COLORS[k]; }
      var txt = el('span', {}, [el('span', { text: names[k] }), el('div', { 'class': 'desc', text: desc[k] })]);
      var count = el('span', { 'class': 'count', text: '0' });
      countEls[k] = count;
      box.appendChild(el('label', {}, [cb, mark, txt, count]));
    });
  }

  function renderUnmapped(list) {
    var ul = document.getElementById('uList');
    ul.textContent = '';
    list.forEach(function (c) {
      var mark;
      if (c.status === 'ice') { mark = el('span', { 'class': 'dot' }); mark.style.background = '#7dd3fc'; }
      else { mark = el('span', { 'class': 'dot' }); mark.style.background = COLORS[c.status]; }
      var sub = c.kind === 'company' ? (c.people.length ? c.people.length + (c.people.length === 1 ? ' person' : ' people') : 'No contacts linked') : (c.company || 'Individual');
      var li = el('li', {}, [
        el('div', { 'class': 'n' }, [mark, document.createTextNode(c.name)]),
        el('div', { text: sub }),
        el('div', { 'class': 'why', text: c.reason || 'No location' })
      ]);
      var a = linkTo(c); if (a) li.appendChild(a);
      ul.appendChild(li);
      unmappedLis.push({ c: c, li: li });
    });
  }

  function showError(text) {
    var m = document.getElementById('msg'); m.textContent = text; m.style.display = text ? 'block' : 'none';
  }

  fetch('/api/contacts', { credentials: 'same-origin' }).then(function (r) {
    if (r.status === 401) { location.href = '/login'; throw new Error('unauthorized'); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (data) {
    stateNames = data.stateNames || {};
    cfg = { recentDays: data.recentDays, coldDays: data.coldDays };
    var pts = jitter(data.mapped);
    data.mapped.forEach(function (c, i) { markers.push({ c: c, layer: makeLayer(c, pts[i]) }); });
    renderLegend();
    renderUnmapped(data.unmapped);
    buildStateSelect(data);
    refresh(true);
    document.getElementById('synced').textContent = data.lastSync ? 'Last sync: ' + new Date(data.lastSync).toLocaleString() : 'No sync yet';
    if (data.lastSyncFailed) showError('The most recent sync failed; data may be stale. Check the sync logs.');
    else if (!data.mapped.length && !data.unmapped.length) showError('No contacts yet. Run "npm run sync" (or "npm run seed-demo").');
  }).catch(function (err) {
    if (err.message !== 'unauthorized') showError('Could not load contacts: ' + err.message);
  });
})();
</script>
</body>
</html>
